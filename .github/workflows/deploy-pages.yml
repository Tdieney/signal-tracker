name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  schedule:
    # Mon-Fri at 16:00 Asia/Ho_Chi_Minh (09:00 UTC)
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build, Test & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Pinned: actions/checkout@v7.0.1 (Node 24 runtime)
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Pinned: actions/setup-python@v6.3.0 (Node 24 runtime)
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'

      # Pinned: actions/setup-node@v7.0.0 (Node 24 runtime)
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # Pinned: actions/configure-pages@v6.0.0 (Node 24 runtime)
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Run Python Pipeline Tests
        run: |
          python -m unittest discover tests -v

      - name: Build Static Dataset from CSV Fixture
        run: |
          python pipeline/build_dataset.py --provider csv --input tests/fixtures/sample_ohlcv.csv --output frontend/public/data --generated-at 2026-08-21T10:00:00Z

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium firefox webkit

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: |
          npm test

      - name: Run Frontend Typecheck
        working-directory: frontend
        run: |
          npm run typecheck

      - name: Build Frontend Pages Bundle
        working-directory: frontend
        run: |
          npm run build:pages

      - name: Run Security and Allow-List Scan
        run: |
          python scripts/security_check.py --artifact frontend/dist

      - name: Run Playwright E2E and Accessibility Suite
        working-directory: frontend
        run: |
          npm run test:e2e

      - name: Artifact Smoke Check
        run: |
          test -f frontend/dist/index.html || { echo "Missing index.html"; exit 1; }
          test -f frontend/dist/data/manifest.json || { echo "Missing manifest.json"; exit 1; }
          test -f frontend/dist/data/overview.json || { echo "Missing overview.json"; exit 1; }
          test -f frontend/dist/data/screener.json || { echo "Missing screener.json"; exit 1; }
          test -f frontend/dist/data/symbols/FPT.json || { echo "Missing FPT.json"; exit 1; }
          echo "Artifact smoke check passed: all required files and assets verified."

      # Pinned: actions/upload-pages-artifact@v5.0.0 (Node 24 runtime)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: 'frontend/dist'

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Pinned: actions/deploy-pages@v5.0.0 (Node 24 runtime)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
