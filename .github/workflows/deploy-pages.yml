name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  schedule:
    # 16:30 ICT (09:30 UTC) Mon-Fri after Vietnam market close
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build, Test & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Pinned: actions/checkout@v7.0.1 (Node 24 runtime)
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check Committed Whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Checking PR commit range: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            git diff --check ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
              echo "Checking push commit range: $BEFORE_SHA..${{ github.sha }}"
              git diff --check "$BEFORE_SHA" "${{ github.sha }}"
            else
              echo "Checking single commit HEAD: ${{ github.sha }}"
              git show --check --format= "${{ github.sha }}"
            fi
          fi

      # Pinned: actions/setup-python@v6.3.0 (Node 24 runtime)
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'

      # Pinned: actions/setup-node@v7.0.0 (Node 24 runtime)
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # Pinned: actions/configure-pages@v6.0.0 (Node 24 runtime)
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Run Python Pipeline Tests
        run: |
          python -m unittest discover tests -v

      - name: Build Live Dataset from Market Provider (Vnstock)
        run: |
          python pipeline/build_dataset.py --provider vnstock --universe VN30 --output frontend/public/data

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Frontend Dependency Security Audit
        working-directory: frontend
        run: |
          npm audit --audit-level=high

      - name: Install Playwright Browsers
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium firefox webkit

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: |
          npm test

      - name: Run Frontend Typecheck
        working-directory: frontend
        run: |
          npm run typecheck

      - name: Build Frontend Pages Bundle
        working-directory: frontend
        run: |
          npm run build:pages

      - name: Run Security and Allow-List Scan
        run: |
          python scripts/security_check.py --artifact frontend/dist

      - name: Run Playwright E2E and Accessibility Suite
        working-directory: frontend
        run: |
          npm run test:e2e

      - name: Artifact Smoke Check
        run: |
          test -f frontend/dist/index.html || { echo "Missing index.html"; exit 1; }
          test -f frontend/dist/data/manifest.json || { echo "Missing manifest.json"; exit 1; }
          test -f frontend/dist/data/overview.json || { echo "Missing overview.json"; exit 1; }
          test -f frontend/dist/data/screener.json || { echo "Missing screener.json"; exit 1; }
          test -f frontend/dist/data/symbols/FPT.json || { echo "Missing FPT.json"; exit 1; }
          echo "Artifact smoke check passed: all required files and assets verified."

      # Pinned: actions/upload-pages-artifact@v5.0.0 (Node 24 runtime)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: 'frontend/dist'

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Pinned: actions/deploy-pages@v5.0.0 (Node 24 runtime)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
