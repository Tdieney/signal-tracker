name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # Run at 17:30 ICT (10:30 UTC) Monday through Friday after market close
    - cron: '30 10 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Pinned: actions/checkout@v4.2.2
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Pinned: actions/setup-python@v5.4.0
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.10'

      # Pinned: actions/setup-node@v4.2.0
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Run Pipeline and Build Static Dataset
        run: |
          python pipeline/build_dataset.py --provider csv --input tests/fixtures/sample_ohlcv.csv --output frontend/public/data

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run Tests
        working-directory: frontend
        run: |
          npm test

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: |
          npm run build

      - name: Run Security and Allow-List Scan
        run: |
          python scripts/security_check.py --artifact frontend/dist

      # Pinned: actions/configure-pages@v5.0.0
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      # Pinned: actions/upload-pages-artifact@v3.0.1
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: 'frontend/dist'

      # Pinned: actions/deploy-pages@v4.0.5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
